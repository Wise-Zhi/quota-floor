[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-floor"
version = "0.1.0a2"
description = "Quota-budgeted graceful landing for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Landing contributors"}]
keywords = ["claude-code", "codex", "ai-agents", "quota", "rate-limit", "budget", "hooks", "handoff"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Wise-Zhi/quota-floor"
Issues = "https://github.com/Wise-Zhi/quota-floor/issues"
Changelog = "https://github.com/Wise-Zhi/quota-floor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "tomli>=2; python_version < '3.11'"]
release = ["build>=1.2", "twine>=5"]

[project.scripts]
landing = "agent_landing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_landing = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
